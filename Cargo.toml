[package]
name = "dbgscope"
version = "0.2.0"
edition = "2024"
description = "Typed WinDbg/DbgEng debug sessions, with kernel pool and user heap walkers built on them."
repository = "https://github.com/glslang/dbgscope"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/dbgscope"
keywords = ["windbg", "dbgeng", "debugging", "kernel", "windows"]
categories = ["development-tools::debugging", "os::windows-apis"]
# Not edition 2024's 1.85 floor: `src/pool/{layout,index,snapshot}.rs` use let-chains, which
# stabilized in 1.88, and `snapshot.rs` uses `usize::is_multiple_of`, which stabilized in 1.87.
# Established by reading the source, not by building on 1.88 -- CI tracks stable and nothing
# here pins a toolchain, so treat it as a floor to re-verify with `cargo-msrv` rather than a
# version under test.
rust-version = "1.88"
# Agent instructions and CI config are repository furniture, not part of the published crate.
# `docs/` stays in: the README links into it, and a reader on docs.rs should be able to follow.
exclude = [
    ".github/",
    ".cursor/",
    "AGENTS.md",
    "CLAUDE.md",
]

[lib]
# cdylib is the !poolmap WinDbg extension (src/pool_extension.rs), not a shellcode payload.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The x86/x64 instruction decoder behind `Instruction`'s typed fields. The engine renders
# disassembly as text and offers no structured form, and recovering operands from that rendering
# means deciding what a character means from the fact that it is present -- which does not survive
# real symbols: `std::map<int,int>` puts a comma inside one, `operator()` a parenthesis,
# `operator[]` a bracket, and each of those severed a direct call edge in turn. Decoding the
# encoding the engine already hands back has none of those ambiguities and needs no extra round
# trip. Default features off: `decoder` and `instr_info` are the whole of what is used -- no
# formatter, because the engine's own rendering is what this crate promises, and no encoder. It
# brings one transitive dependency, `lazy_static`, for the tables `instr_info` reads.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
hex = "0.4.3"
thiserror = "2.0.18"
# **Needed, and not upgradable on its own.** Nothing in this crate writes `windows_core::`: every
# use is `windows::core::`, so a grep says this dependency is dead. It is not. The
# `#[windows::core::implement(..)]` macro on the two callback objects in `src/dbgeng.rs` expands to
# absolute `::windows_core::` paths, which resolve against *extern crates* only -- removing the
# dependency fails with "could not find `windows_core` in the list of imported crates", and a
# `use windows::core as windows_core;` alias does not satisfy it, because an alias is a module item
# and `::name` is not.
#
# The version tracks `windows`, which requires `windows-core ^0.62.2`. crates.io has 0.100.0, and a
# dependency check will call this outdated; taking it is not an upgrade but a **second** copy in the
# graph. Measured 2026-09-15: the macro then emits paths into 0.100 while the interfaces come from
# `windows`'s 0.62.2, and the build fails with `the trait bound IDebugOutputCallbacks:
# windows_core::Interface is not satisfied`. 0.100 also wants Rust 1.95 against this crate's 1.88
# floor. Move this only when the umbrella `windows` crate moves, and keep the two in step.
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Debug_Extensions",
    "Win32_System_SystemInformation",
    # `RtlUpcaseUnicodeChar`, which is how `object::same_object_name` folds a name: it is the
    # object manager's own fold rather than a reproduction of it. Under `Wdk` rather than `Win32`
    # because that is where Microsoft's metadata puts the ntdll Rtl surface.
    "Wdk_System_SystemServices",
]

# `examples/undecoded_families.rs` only, which decodes every 32-bit word twice -- once with this
# crate's A64 decoder and once with a table generated from the architecture -- and reports the
# instruction families the second knows and the first does not. Seven review rounds on dbgscope#171
# each found one or two of those by hand; this answers the whole question in fifty seconds, and it
# is worth a dev-dependency to make "what else is missing" a command rather than a round of review.
# A dev-dependency costs a consumer of the library nothing: it is not in their graph.
[dev-dependencies]
disarm64 = "0.2"

# Only `examples/user_heap_smoke.rs` allocates on the host heap it then walks. Cargo unifies
# this with the normal dependency when building examples and tests, and a downstream consumer
# of the library still resolves the four features above and no more.
[dev-dependencies.windows]
version = "0.62.2"
features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
    # `GetConsoleProcessList` and `EnumWindows`/`IsWindowVisible`, which is how the launch tests
    # check that a debuggee gets a console of its own and that the console has no window
    # (issue #129). Test-only: a consumer of the library resolves neither.
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
]

# docs.rs builds on Linux, where this crate does not compile at all. `default-target` is
# spelled out rather than left to docs.rs' "first of `targets`" fallback, because that fallback
# is the only thing standing between a rename of this list and a docs build against the Linux
# host — which fails outright, and fails the same way for every version.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
